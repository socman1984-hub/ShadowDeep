<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0907">
  <title>Shadowdeep</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="xpBar"><div id="xpFill"></div></div>
    <div id="topLeft">
      <div class="bar hp"><div class="fill" id="hpFill"></div><span id="hpText"></span></div>
      <div class="bar mp"><div class="fill" id="mpFill"></div><span id="mpText"></span></div>
      <div id="infoLine"><span id="lvlText"></span> · <span id="floorText"></span> · <span id="goldText" class="gold"></span></div>
    </div>
    <div id="topRight">
      <canvas id="minimap" width="128" height="128"></canvas>
      <div id="menuBtns">
        <button class="menuBtn" data-open="character">👤<span class="badge" id="attrBadge"></span></button>
        <button class="menuBtn" data-open="skills">📜</button>
        <button class="menuBtn" data-open="inventory">🎒<span class="badge" id="bagBadge"></span></button>
        <button class="menuBtn" data-open="forge">⚒️</button>
        <button class="menuBtn" data-open="upgrades">⭐</button>
      </div>
    </div>
    <div id="joyZone"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="actions"></div>
    <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
    <div id="toast"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="panelBox">
      <div class="tabs">
        <button class="tab" data-tab="character">👤<span> Hero</span></button>
        <button class="tab" data-tab="skills">📜<span> Skills</span></button>
        <button class="tab" data-tab="inventory">🎒<span> Gear</span></button>
        <button class="tab" data-tab="forge">⚒️<span> Forge</span></button>
        <button class="tab" data-tab="upgrades">⭐<span> Upgrades</span></button>
        <button id="closePanel" aria-label="Close">✕</button>
      </div>
      <div id="panelBody"></div>
    </div>
  </div>

  <div id="title" class="overlay">
    <h1>Shadowdeep</h1>
    <p class="sub">Descend. Slay. Grow stronger.</p>
    <button id="continueBtn" class="big hidden">Continue <small id="saveInfo"></small></button>
    <button id="newBtn" class="big">New Game</button>
    <p class="help">Left side: drag to move · Right side: hold buttons to attack &amp; cast<br>
      Best in landscape. Add to Home Screen for fullscreen.<br>
      <span class="dim">Keyboard: WASD move · Space slash · 1–4 spells · Q potion · C / K / I / F / U menus</span></p>
  </div>

  <div id="death" class="overlay hidden">
    <h1 class="red">You Have Died</h1>
    <p class="sub" id="deathSub"></p>
    <button id="respawnBtn" class="big">Respawn</button>
  </div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/input.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
